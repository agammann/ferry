name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test
      - run: node ferry.mjs examples/before.ics examples/after.ics report.json 2027-01-01 2028-01-01
